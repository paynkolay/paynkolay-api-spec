openapi: 3.0.3
info:
  title: PayNKolay API
  description: |
    PayNKolay sanal POS API entegrasyonu.

    ## Authentication

    All requests require an `sx` token provided by PayNKolay. Different operations may require different sx token variants:
    - **sx**: Standard payment token
    - **sx-list**: Token with list permission suffix
    - **sx-cancel**: Token with cancel/refund permission suffix

    ## Hash Verification (hashDatav2)

    Most endpoints require a `hashDatav2` field for request integrity. The hash is computed as:

    ```
    hashDatav2 = base64(SHA512(field1 + "|" + field2 + "|" + ... + "|" + merchantSecretKey))
    ```

    The fields included in the hash vary per endpoint and are documented in each operation's description.

    See: https://paynkolay.com.tr/entegrasyon/hash-hazirlama

    ## Response Codes

    | Code | Meaning |
    |------|---------|
    | 0 | Error / Failed |
    | 2 | Success |

    ## Currency Codes

    | Code | Currency |
    |------|----------|
    | 949  | TRY      |
    | 840  | USD      |
    | 978  | EUR      |

    ## Test Cards

    Use these cards with the **Test** server (`paynkolaytest.nkolayislem.com.tr`).

    | Bank | Card Number | Expiry | CVV |
    |------|-------------|--------|-----|
